spring.application.name=order-service
server.port=${SERVER_PORT:8083}
spring.mongodb.database=${MONGODB_DATABASE:food_order}
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.jwt.secret-base64=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:foodieexpress-user-service}
app.jwt.audience=${JWT_AUDIENCE:foodieexpress-api}
app.internal.restaurant.private-key-base64=${ORDER_RESTAURANT_INTERNAL_PRIVATE_KEY_BASE64:}
app.internal.restaurant.public-key-base64=${ORDER_RESTAURANT_INTERNAL_PUBLIC_KEY_BASE64:}
app.internal.jwt.issuer=${ORDER_INTERNAL_JWT_ISSUER:foodieexpress-order-service}
app.internal.jwt.audience=${RESTAURANT_INTERNAL_JWT_AUDIENCE:foodieexpress-restaurant-service}
app.internal.jwt.ttl=${INTERNAL_JWT_TTL:PT1M}
app.internal.user.private-key-base64=${ORDER_USER_INTERNAL_PRIVATE_KEY_BASE64:}
app.internal.user.public-key-base64=${ORDER_USER_INTERNAL_PUBLIC_KEY_BASE64:}
app.internal.user.issuer=${ORDER_INTERNAL_JWT_ISSUER:foodieexpress-order-service}
app.internal.user.audience=${USER_INTERNAL_JWT_AUDIENCE:foodieexpress-user-service}
app.internal.delivery.private-key-base64=${ORDER_DELIVERY_INTERNAL_PRIVATE_KEY_BASE64:}
app.internal.delivery.public-key-base64=${ORDER_DELIVERY_INTERNAL_PUBLIC_KEY_BASE64:}
app.internal.delivery.issuer=${ORDER_INTERNAL_JWT_ISSUER:foodieexpress-order-service}
app.internal.delivery.audience=${DELIVERY_INTERNAL_JWT_AUDIENCE:foodieexpress-delivery-service}
app.internal.delivery.ttl=${INTERNAL_JWT_TTL:PT1M}
app.internal.delivery.callback-public-key-base64=${DELIVERY_ORDER_INTERNAL_PUBLIC_KEY_BASE64:}
app.internal.delivery.callback-issuer=${DELIVERY_INTERNAL_JWT_ISSUER:foodieexpress-delivery-service}
app.internal.delivery.callback-audience=${ORDER_DELIVERY_CALLBACK_AUDIENCE:foodieexpress-order-service}
app.clients.user-service.base-url=${USER_SERVICE_BASE_URL:http://localhost:8081}
app.clients.restaurant-service.base-url=${RESTAURANT_SERVICE_BASE_URL:http://localhost:8082}
app.clients.delivery-service.base-url=${DELIVERY_SERVICE_BASE_URL:http://localhost:8084}
app.clients.connect-timeout=${SERVICE_CONNECT_TIMEOUT:PT2S}
app.clients.read-timeout=${SERVICE_READ_TIMEOUT:PT3S}
spring.data.mongodb.auto-index-creation=false
