spring.application.name=restaurant-service
server.port=${SERVER_PORT:8082}
spring.mongodb.database=${MONGODB_DATABASE:food_restaurant}
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.jwt.secret-base64=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:foodieexpress-user-service}
app.jwt.audience=${JWT_AUDIENCE:foodieexpress-api}
app.internal.jwt.public-key-base64=${ORDER_RESTAURANT_INTERNAL_PUBLIC_KEY_BASE64:}
app.internal.jwt.issuer=${ORDER_INTERNAL_JWT_ISSUER:foodieexpress-order-service}
app.internal.jwt.audience=${RESTAURANT_INTERNAL_JWT_AUDIENCE:foodieexpress-restaurant-service}
