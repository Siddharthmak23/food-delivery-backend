spring.application.name=delivery-service
server.port=${SERVER_PORT:8084}
spring.mongodb.database=${MONGODB_DATABASE:food_delivery}
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.jwt.secret-base64=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:foodieexpress-user-service}
app.jwt.audience=${JWT_AUDIENCE:foodieexpress-api}
app.internal.order.public-key-base64=${ORDER_DELIVERY_INTERNAL_PUBLIC_KEY_BASE64:}
app.internal.order.issuer=${ORDER_INTERNAL_JWT_ISSUER:foodieexpress-order-service}
app.internal.order.audience=${DELIVERY_INTERNAL_JWT_AUDIENCE:foodieexpress-delivery-service}
app.internal.delivery.private-key-base64=${DELIVERY_ORDER_INTERNAL_PRIVATE_KEY_BASE64:}
app.internal.delivery.public-key-base64=${DELIVERY_ORDER_INTERNAL_PUBLIC_KEY_BASE64:}
app.internal.delivery.issuer=${DELIVERY_INTERNAL_JWT_ISSUER:foodieexpress-delivery-service}
app.internal.delivery.audience=${ORDER_DELIVERY_CALLBACK_AUDIENCE:foodieexpress-order-service}
app.internal.jwt.ttl=${INTERNAL_JWT_TTL:PT1M}
app.delivery.demo-partners=${DELIVERY_DEMO_PARTNERS:demo-partner-01:Demo Partner 1}
app.clients.order-service.base-url=${ORDER_SERVICE_BASE_URL:http://localhost:8083}
app.clients.connect-timeout=${SERVICE_CONNECT_TIMEOUT:PT2S}
app.clients.read-timeout=${SERVICE_READ_TIMEOUT:PT3S}
spring.data.mongodb.auto-index-creation=false
