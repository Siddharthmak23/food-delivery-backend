spring.application.name=user-service
server.port=${SERVER_PORT:8081}
spring.mongodb.database=${MONGODB_DATABASE:food_user}
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring.data.mongodb.auto-index-creation=false
spring.jackson.deserialization.fail-on-unknown-properties=true
app.jwt.issuer=${JWT_ISSUER:foodieexpress-user-service}
app.jwt.audience=${JWT_AUDIENCE:foodieexpress-api}
app.jwt.secret-base64=${JWT_SECRET:}
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}
app.internal.order.public-key-base64=${ORDER_USER_INTERNAL_PUBLIC_KEY_BASE64:}
app.internal.jwt.issuer=${ORDER_INTERNAL_JWT_ISSUER:foodieexpress-order-service}
app.internal.jwt.audience=${USER_INTERNAL_JWT_AUDIENCE:foodieexpress-user-service}
